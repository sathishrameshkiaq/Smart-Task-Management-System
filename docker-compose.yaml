version: "3.9"

services:
  mongodb:
    image: mongodb/mongodb-community-server:5.0-ubuntu2004
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/var/lib/mongodb
    networks:
      - smart-network

  auth-service:
    build: ./auth-service_1784011000189
    container_name: auth-service
    ports: 
      - "5001:5001"
    environment:
      - PORT=5001
      - MONGO_URI=mongodb://mongodb:27017/auth_db
      - JWT_SECRET=DB_secret
    depends_on:
      - mongodb
    networks:
      - smart-network

  task-service:
    build: ./task-service
    container_name: task-service
    ports: 
      - "5002:5002"
    environment:
      - PORT=5002
      - MONGO_URI=mongodb://mongodb:27017/task_db
      - JWT_SECRET=DB_secret
    depends_on:
      - mongodb
    networks:
      - smart-network

  notification-service:
    build: ./notification-service
    container_name: notification-service
    ports:
      - "5003:5003"
    environment:
      - PORT=5003
      - MONGO_URI=mongodb://mongodb:27017/notification_db
      - JWT_SECRET=DB_secret
    depends_on: 
      - mongodb
    networks:
      - smart-network

  report-service:
    build: ./report-service
    container_name: report-service
    ports: 
      - "5004:5004"
    environment:
      - PORT=5004
      - MONGO_URI=mongodb://mongodb:27017/report_db
      - JWT_SECRET=DB_secret
    depends_on:
      - mongodb
    networks:
      - smart-network

  api-gateway:
    build: ./api-gateway_1784010924579
    container_name: api-gateway
    ports: 
      - "5000:5000"
    environment:
      - PORT=5000
      - AUTH_SERVICE_URL=http://auth-service:5001
      - TASK_SERVICE_URL=http://task-service:5002
      - JWT_SECRET=DB_secret
    depends_on:
      - auth-service
      - task-service
    networks:
      - smart-network
  
  frontend:
    build: ./frontend
    container_name: fronetend-app
    ports:
      - "80:80"
    depends_on:
      - api-gateway
    networks:
      - smart-network

volumes:
  mongodb_data:

networks:
  smart-network:
    driver: bridge
