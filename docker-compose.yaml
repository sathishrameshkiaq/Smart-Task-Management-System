version: "3.9"

services:
  mongodb:
    image: mongo:8
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME: admin
      - MONGO_INITDB_ROOT_PASSWORD: Mongo_Pass@!
    volumes:
      - mongo_data:/data/db
    networks:
      - smart-network

  auth-service:
    build: ./auth-service_1784011000189
    container_name: auth-service
    environment:
      - PORT=5001
      - MONGO_URI=mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017/authdb?authSource=admin
      - JWT_SECRET=MySecret@123
    depends_on:
      - mongodb
    networks:
      - smart-network

  task-service:
    build: ./task-service
    container_name: task-service
    environment:
      - PORT=5002
      - MONGO_URI=mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017/taskdb?authSource=admin
      - JWT_SECRET=MySecret@123
    depends_on:
      - mongodb
    networks:
      - smart-network

  notification-service:
    build: ./notification-service
    container_name: notification-service
    environment:
      - PORT=5003
      - MONGO_URI=mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017/notificationdb?authSource=admin
      - JWT_SECRET=MySecret@123
    depends_on:
      - mongodb
    networks:
      - smart-network

  report-service:
    build: ./report-service
    container_name: report-service
    environment:
      - PORT=5004
      - MONGO_URI=mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017/reportdb?authSource=admin
      - JWT_SECRET=MySecret@123
    depends_on:
      - mongodb
    networks:
      - smart-network

  api-gateway:
    build: ./api-gateway_1784010924579
    container_name: api-gateway
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - AUTH_SERVICE_URL=http://auth-service:5001
      - TASK_SERVICE_URL=http://task-service:5002
      - NOTIFICATION_SERVICE_URL=http://notification-service:5003
      - REPORT_SERVICE_URL=http://report-service:5004
      - JWT_SECRET=MySecret@123
    depends_on:
      - auth-service
      - task-service
      - notification-service
      - report-service
    networks:
      - smart-network

volumes:
  mongo_data:

networks:
  smart-network:
    driver: bridge


